global:
  scrape_interval: 15s

scrape_configs:
  # Services running on your laptop (./gradlew bootRun)
  - job_name: telemetry-services-local
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - host.docker.internal:8081
          - host.docker.internal:8082
          - host.docker.internal:8083

  # Services running inside Docker (--profile apps)
  - job_name: telemetry-services-docker
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - ingestion-service:8081
          - processing-service:8082
          - query-service:8083
